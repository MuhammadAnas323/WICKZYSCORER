name: sportyapp
description: "CRIXORA — Premium Cricket Companion App with Live Scores, Fixtures & Live Streaming."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # UI & Fonts
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  lottie: ^3.1.2

  # Media & Camera
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_database: ^12.4.6
  path_provider: ^2.1.6
  path: ^1.9.1
  agora_rtc_engine: ^6.6.3
  permission_handler: ^11.3.1
  cloud_functions: ^6.3.5
  crypto: ^3.0.3
  http: ^1.2.1
  video_player: ^2.9.2

dependency_overrides:
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

